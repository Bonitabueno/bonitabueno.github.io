<!DOCTYPE html>
<html class="light" lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Bonitabueno</title>
    <meta property="og:title" content="Bonitabueno | VIBE_OS" />
    <meta property="og:description" content="Bonitabueno's official Website" />
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://bonitabueno.github.io/assets/og-image.webp" />
    <meta property="og:url" content="https://bonitabueno.github.io/" />    
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="js/tailwind.config_index.js"></script>
    <link rel="stylesheet" href="css/index.css" />
  </head>

  <body class="font-display bg-terminal-bg text-terminal-text w-full relative selection:bg-terminal-accent selection:text-white overflow-x-hidden min-h-screen overflow-y-auto md:h-screen md:overflow-hidden">
    <div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
      <div class="absolute inset-0 bg-noise opacity-10 mix-blend-multiply"></div>
      <div class="absolute inset-0 bg-scanlines opacity-40 pointer-events-none"></div>
      <div class="absolute top-[-10%] left-[20%] w-[600px] h-[600px] bg-clay-accent/10 rounded-full blur-[120px] animate-pulse-slow"></div>

      <div
        class="absolute bottom-[-10%] right-[10%] w-[500px] h-[500px] bg-terminal-accent/10 rounded-full blur-[100px] animate-pulse-slow"
        style="animation-delay: 1.5s"
      ></div>

      <div
        class="absolute top-0 left-0 w-full h-[2px] bg-terminal-accent/20 blur-[1px] animate-scan pointer-events-none"
      ></div>
    </div>

    <main
      class="relative z-10 flex flex-col items-center px-6 w-full justify-start pt-16 pb-12 min-h-screen md:h-full md:justify-center md:py-0"
    >
      <div class="w-full max-w-5xl relative">
        <div class="flex items-center gap-3 mb-12 opacity-80 font-mono text-xs tracking-widest text-terminal-dim">
          <span class="material-symbols-outlined text-sm text-terminal-accent">
            terminal
          </span>
          <span class="text-terminal-accent/80">
            VIBE_OS_KERNEL // SESSION: ACTIVE
          </span>
          <div
            class="h-px flex-1 bg-gradient-to-r from-terminal-accent/30 to-transparent"
          ></div>
        </div>

        <div class="mb-8 md:mb-12 relative pl-2 md:pl-0">
          <p class="font-mono text-terminal-dim/70 text-sm mb-3 ml-1">
            &gt; echo $CURRENT_STATUS
          </p>

          <div class="hidden md:flex items-center flex-nowrap">
            <div class="overflow-hidden whitespace-nowrap animate-typewriter min-h-[6.5rem] lg:min-h-[7.5rem]">
              <h1 class="inline-flex items-center text-6xl lg:text-7xl font-bold tracking-tight text-terminal-text font-mono leading-tight">
                Building by Vibe...
                <span class="ml-1 inline-block w-4 h-16 bg-terminal-accent animate-blink rounded-[1px]"></span>
              </h1>
            </div>
          </div>

          <div class="flex flex-col md:hidden items-start">
            <div class="overflow-hidden whitespace-nowrap animate-typewriter w-fit">
              <h1 class="text-4xl font-bold tracking-tight text-terminal-text font-mono leading-tight">
                Building by
              </h1>
            </div>
            <div class="overflow-hidden whitespace-nowrap animate-typewriter w-0 [animation-delay:3s] [animation-fill-mode:forwards]">
              <h1 class="inline-flex items-center text-4xl font-bold tracking-tight text-terminal-text font-mono leading-tight">
                Vibe...
                <span class="ml-1 inline-block w-3 h-10 bg-terminal-accent animate-blink rounded-[1px]"></span>
              </h1>
            </div>
          </div>
        </div>

        <div class="flex justify-center opacity-0 animate-enter-fade [animation-delay:3s]">
          <a
            href="0331project.html"
            class="group relative inline-flex items-center gap-2.5 bg-transparent border border-terminal-dim/30 px-5 py-2 rounded-md hover:border-terminal-accent/50 hover:bg-terminal-accent/5 transition-all duration-300 overflow-hidden animate-float"
          >
            <span
              class="absolute inset-0 -translate-x-full group-hover:translate-x-full transition-transform duration-700 ease-out bg-gradient-to-r from-transparent via-terminal-accent/10 to-transparent pointer-events-none"
            ></span>

            <span class="font-mono text-terminal-accent/60 text-xs">
              &gt;
            </span>

            <span
              class="font-mono text-xs font-bold tracking-[0.25em] text-terminal-text group-hover:text-terminal-accent transition-colors duration-300"
            >
              ENTER
            </span>

            <span
              class="material-symbols-outlined text-terminal-accent text-sm transition-transform duration-300 group-hover:translate-x-1"
            >
              arrow_forward
            </span>
          </a>
        </div>
      </div>
    </main>
  </body>
</html>
